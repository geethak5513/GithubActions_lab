name: Check AWS Access

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check-access:
    runs-on: ubuntu-latest

    steps:
      - name: Show OIDC claims for troubleshooting
        shell: python
        run: |
          import base64
          import json
          import os
          import urllib.request

          url = (
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience=sts.amazonaws.com"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": (
                      "Bearer "
                      + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                  )
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref"):
              print(f"{key}: {claims.get(key)}")

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::649445653391:role/Githubactions_lab
          role-session-name: githubactionslab
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify AWS access
        run: aws sts get-caller-identity
