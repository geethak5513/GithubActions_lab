name: Check AWS Access

on:
  push:
    branches:
      - main

jobs:
  check-access:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC Token Claim
        run: |
          echo "==== DEBUGGING OIDC ISSUER AND SUBJECT ===="
          # Fetch the token from GitHub's local environment runner
          ACTIONS_TOKEN=$(curl -s "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=://amazonaws.com" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          
          # Safely decode the middle section (payload) of the JWT token
          JWT_PAYLOAD=$(echo "$ACTIONS_TOKEN" | jq -r '.value' | cut -d'.' -f2)
          
          # Print the exact repository and organization details AWS sees
          echo "$JWT_PAYLOAD" | base64 --decode 2>/dev/null | jq '{iss: .iss, sub: .sub, aud: .aud, repository: .repository, repository_owner: .repository_owner}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::649445653391:role/Githubactions_lab
          role-session-name: githubactionslab
          aws-region: us-east-1
